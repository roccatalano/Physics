<!--{"id":"3D-1-u238-chain","section":"3D","title":"The uranium-238 decay series","criteria":["3D.1"],
"blurb":"Step U-238 down its decay series on an N against Z grid: 8 alpha and 6 beta-minus decays to stable lead-206, with each equation and half-life.",
"source":"Cambridge VCE Physics Units 1&2, 3D Analysing decay series diagrams (Figure 3D–2). γ emissions are not shown, as they do not change N or Z.","colour":"#f472b6"}-->
<div class="ctx">U-238 does not reach stability in one step. It decays <b>14 times</b>, each daughter unstable, until it becomes <b>lead-206</b>.</div>
<div class="row" style="flex:1">
 <div class="card plot" style="--c:#f472b6"><h3>Neutron number N against proton number Z</h3><svg id="sv" viewBox="0 0 780 440"></svg></div>
 <div class="side">
  <div class="card ctl" style="--c:#fbb040"><h3>Step through</h3>
   <div class="btns"><button id="bk">◀ Back</button><button id="nx">Next ▶</button><button id="pl">Play all</button><button id="rs">Reset</button></div>
  </div>
  <div class="card out" style="--c:#4ade80"><h3 id="st">Decay</h3><div id="eq" style="font:600 30px 'Space Grotesk';min-height:46px;display:flex;align-items:center;gap:8px"></div><div id="hl" style="font-size:19px;color:#cfd7f5"></div>
   <div style="font-size:20px;margin-top:6px">α decays: <b class="pk" id="na"></b> &nbsp; β⁻ decays: <b class="cy" id="nb"></b></div></div>
  <div class="rule"><b class="pk">α</b>: Z − 2, N − 2 (down and left).<br><b class="cy">β⁻</b>: Z + 1, N − 1 (down and right).</div>
 </div>
</div>
<script>
const SYM={82:'Pb',83:'Bi',84:'Po',86:'Rn',88:'Ra',90:'Th',91:'Pa',92:'U'};
// [Z, A, half-life of this nuclide, decay mode]
const CH=[[92,238,'4.5 × 10⁹ years','a'],[90,234,'24 days','b'],[91,234,'1.2 minutes','b'],[92,234,'245 000 years','a'],[90,230,'75 000 years','a'],[88,226,'1600 years','a'],[86,222,'3.8 days','a'],[84,218,'3.1 minutes','a'],[82,214,'27 minutes','b'],[83,214,'20 minutes','b'],[84,214,'160 μs','a'],[82,210,'22 years','b'],[83,210,'5.0 days','b'],[84,210,'138 days','a'],[82,206,'stable','']];
const sv=document.getElementById('sv'),Z0=80.5,Z1=93.5,N0=121,N1=148,GX=70,GW=680,GT=14,GB=380;
const X=z=>GX+(z-Z0)/(Z1-Z0)*GW,Y=n=>GB-(n-N0)/(N1-N0)*(GB-GT);
for(let z=81;z<=93;z++){el('line',{x1:X(z),x2:X(z),y1:GT,y2:GB,stroke:'#232c63'},sv);txt(sv,X(z),GB+24,z,{fill:'#8b96c0','font-size':17,'text-anchor':'middle'});if(SYM[z])txt(sv,X(z),GB+46,SYM[z],{fill:'#cfd7f5','font-size':17,'text-anchor':'middle'})}
for(let n=122;n<=146;n+=4){el('line',{x1:GX,x2:GX+GW,y1:Y(n),y2:Y(n),stroke:'#232c63'},sv);txt(sv,GX-10,Y(n)+6,n,{fill:'#8b96c0','font-size':17,'text-anchor':'end'})}
txt(sv,GX+GW,GB+46,'Z',{fill:'#cfd7f5','font-size':18,'text-anchor':'end'});txt(sv,GX-10,GT+4,'N',{fill:'#cfd7f5','font-size':18,'text-anchor':'end'});
function arrowDef(id,c){const m=el('marker',{id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:4.5,markerHeight:4.5,orient:'auto'},el('defs',{},sv));el('path',{d:'M0 0L10 5L0 10z',fill:c},m)}
arrowDef('ma','#f472b6');arrowDef('mb','#7dd3fc');
const arr=el('g',{},sv),nodes=el('g',{},sv);
const P=CH.map(([z,a])=>[X(z),Y(a-z)]);
const ND=CH.map(([z,a],i)=>{const g=el('g',{},nodes);const c=el('circle',{cx:P[i][0],cy:P[i][1],r:10,fill:i===14?'#4ade80':'#fbb040',stroke:'#0d1330','stroke-width':2.5},g);
 const L=['T','L','T','R','BR','R','R','L','L','BL','R','L','BL','R','L'][i],x=P[i][0],y=P[i][1];
 const pos={T:[x,y-18,'middle'],L:[x-16,y+6,'end'],R:[x+16,y+6,'start'],BL:[x-8,y+26,'end'],BR:[x+10,y+28,'start']}[L];const t=txt(g,pos[0],pos[1],SYM[z]+'-'+a,{fill:'#eef2ff','font-size':18,'text-anchor':pos[2]});return{g,c,t}});
const AR=CH.slice(0,14).map(([z,a,h,m],i)=>{const[x1,y1]=P[i],[x2,y2]=P[i+1],L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L;
 return el('line',{x1:x1+ux*12,y1:y1+uy*12,x2:x2-ux*13,y2:y2-uy*13,stroke:m==='a'?'#f472b6':'#7dd3fc','stroke-width':3.5,'marker-end':`url(#m${m})`},arr)});
const ring=el('circle',{r:17,fill:'none',stroke:'#fff','stroke-width':3},sv);
let k=0,play=false,last=0;
const nuc=(A,Z,S,c)=>`<span style="display:inline-flex;align-items:center;color:${c||'inherit'}"><span style="display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.5em;line-height:1.05;margin-right:2px"><span>${A}</span><span>${Z}</span></span>${S}</span>`;
function upd(){ND.forEach((d,i)=>{d.g.style.opacity=i<=k?1:.18});AR.forEach((a,i)=>a.style.display=i<k?'':'none');
 const[z,a]=CH[k];ring.setAttribute('cx',P[k][0]);ring.setAttribute('cy',P[k][1]);
 let na=0,nb=0;for(let i=0;i<k;i++)CH[i][3]==='a'?na++:nb++;document.getElementById('na').textContent=na;document.getElementById('nb').textContent=nb;
 if(k===0){document.getElementById('st').textContent='Start: the parent';document.getElementById('eq').innerHTML=nuc(238,92,'U');document.getElementById('hl').textContent='Half-life 4.5 × 10⁹ years'}
 else{const[pz,pa,ph,m]=CH[k-1];document.getElementById('st').innerHTML=`Decay ${k} of 14: <span style="text-transform:none">${m==='a'?'α':'β⁻'}</span>`;
  document.getElementById('eq').innerHTML=nuc(pa,pz,SYM[pz])+' → '+nuc(a,z,SYM[z],'#fbb040')+' + '+(m==='a'?nuc(4,2,'He','#f472b6'):nuc(0,-1,'β','#7dd3fc'));
  document.getElementById('hl').textContent=k===14?'Lead-206 is stable: the series ends.':`${SYM[z]}-${a} half-life: ${CH[k][2]}`}}
const go=d=>{k=Math.max(0,Math.min(14,k+d));upd()};
document.getElementById('nx').onclick=()=>go(1);document.getElementById('bk').onclick=()=>go(-1);document.getElementById('rs').onclick=()=>{k=0;upd()};
toggle('pl',on=>{play=on;if(on&&k===14)k=0;last=IX.t;upd()});
upd();
IX.anims.push(t=>{if(play&&t-last>1.3){last=t;if(k<14)go(1);else{play=false;document.getElementById('pl').classList.remove('on')}}ring.setAttribute('r',16+3*Math.sin(t*5))});
</script>
