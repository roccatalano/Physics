<!--{"id":"3E-1-dose-calculator","section":"3E","title":"Absorbed dose and dose equivalent","criteria":["3E.5","3E.2","3E.3"],
"blurb":"Set the energy absorbed, the mass of tissue and the type of radiation. Get the absorbed dose in gray and the dose equivalent in sievert, and see where it sits on a scale of effects.",
"source":"Cambridge VCE Physics Units 1&2, 3E The effect of radiation on humans (pp. 131–136). Radiation weighting factors: α 20, β and γ 1. Scale markers from the book.","colour":"#f87171"}-->
<div class="ctx">The same absorbed energy does <b>more damage</b> when it comes from α particles, so we weight it.</div>
<div class="row" style="flex:1">
 <div class="card plot" style="--c:#f87171;gap:6px"><h3>Ionisations in the tissue</h3><svg id="ts" viewBox="0 0 780 130" style="flex:none;height:130px"></svg>
  <h3 style="margin-top:4px;color:#fbb040">Dose equivalent (log scale)</h3><svg id="sc" viewBox="0 0 780 270"></svg></div>
 <div class="side">
  <div class="card ctl" style="--c:#fbb040"><h3>Exposure</h3>
   <div class="btns"><button class="rd" data-v="20">α</button><button class="rd" data-v="1b">β</button><button class="rd on" data-v="1g">γ</button><button id="ex">Book: 2 mGy</button></div>
   <div class="sl" style="grid-template-columns:76px 1fr 104px"><span class="nm">Energy</span><input type="range" id="e" min="-4" max="0" step="0.05" value="-2"><span class="v" id="ev"></span></div>
   <div class="sl" style="grid-template-columns:76px 1fr 104px"><span class="nm">Mass</span><input type="range" id="m" min="-1" max="2" step="0.05" value="1.85"><span class="v" id="mv"></span></div>
  </div>
  <div class="card out" style="--c:#4ade80;font-size:19px;line-height:1.5"><h3>Calculate</h3><div id="c1"></div><div id="c2"></div></div>
  <div class="rule" style="font-size:17px"><b>Gy</b> = J kg⁻¹ (energy per kg).<br><b>Sv</b> = Gy × weighting factor.</div>
 </div>
</div>
<script>
let E=.01,M=70,W=1,K='g',shown=-3;
const pre=v=>{const a=Math.abs(v);return a>=1?[v,'']:a>=1e-3?[v*1e3,'m']:[v*1e6,'μ']};
const fmt=(v,u)=>{const[x,p]=pre(v);return (+sig(x,3)).toLocaleString('en-AU')+' '+p+u};
// scale
const sc=document.getElementById('sc'),SX=40,SW=700,LMIN=-6,LMAX=2,SY=150;
const lx=L=>SX+(L-LMIN)/(LMAX-LMIN)*SW;
const grad=el('linearGradient',{id:'gd'},el('defs',{},sc));[['0','#4ade80'],['.55','#fbb040'],['.8','#f87171'],['1','#b91c1c']].forEach(([o,c])=>el('stop',{offset:o,'stop-color':c},grad));
el('rect',{x:SX,y:SY,width:SW,height:22,rx:11,fill:'url(#gd)'},sc);
[[-6,'1 μSv'],[-3,'1 mSv'],[0,'1 Sv'],[2,'100 Sv']].forEach(([L,s])=>{el('line',{x1:lx(L),x2:lx(L),y1:SY+22,y2:SY+32,stroke:'#8b96c0','stroke-width':2},sc);txt(sc,lx(L),SY+54,s,{fill:'#8b96c0','font-size':17,'text-anchor':'middle'})});
for(let L=-5;L<=1;L++)if(L!==-3&&L!==0)el('line',{x1:lx(L),x2:lx(L),y1:SY+22,y2:SY+29,stroke:'#5b6690','stroke-width':2},sc);
// book markers [log10 Sv, label, row]
const MK=[[-3,'1 mSv: public limit a year',3],[Math.log10(.02),'20 mSv: worker limit a year',2],[-1,'100 mSv: 1 in 1000 risk',1],[0,'1 Sv: radiation sickness',0]];
MK.forEach(([L,s,r])=>{const y=SY-20-r*26;el('line',{x1:lx(L),x2:lx(L),y1:y+5,y2:SY,stroke:'#cfd7f5','stroke-width':1.5,'stroke-dasharray':'3 4'},sc);el('circle',{cx:lx(L),cy:y+5,r:3,fill:'#cfd7f5'},sc);txt(sc,lx(L)+6,y,s,{fill:'#cfd7f5','font-size':16})});
const ptr=el('g',{},sc);el('path',{d:'M-12,-16L12,-16L0,0Z',fill:'#fff'},ptr);el('rect',{x:-2,y:0,width:4,height:30,fill:'#fff'},ptr);const pl=txt(ptr,0,74,'',{fill:'#fff','font-size':22,'font-weight':700,'text-anchor':'middle'});
// tissue
const ts=document.getElementById('ts');el('rect',{x:20,y:10,width:740,height:110,rx:14,fill:'#3b1d3a',stroke:'#f472b6','stroke-opacity':.4},ts);
for(let i=0;i<60;i++)el('circle',{cx:40+(i%15)*49+(Math.floor(i/15)%2)*24,cy:28+Math.floor(i/15)*25,r:9,fill:'none',stroke:'#f472b6','stroke-opacity':.3,'stroke-width':2},ts);
const io=el('g',{},ts);
function upd(){const D=E/M,H=D*W;
 document.getElementById('c1').innerHTML=`Absorbed dose = <span class="frac">E/m</span><br>= ${fmt(E,'J')} ÷ ${(+sig(M,3))} kg = <b class="hi">${fmt(D,'Gy')}</b>`;
 document.getElementById('c2').innerHTML=`Dose equivalent = ${fmt(D,'Gy')} × ${W}<br>= <b class="hi">${fmt(H,'Sv')}</b>`;
 pl.textContent=fmt(H,'Sv')}
group('.rd',v=>{W=parseInt(v);K=v==='20'?'a':v==='1b'?'b':'g';upd()});
slider('e',x=>fmt(10**x,'J'),x=>{E=+sig(10**x,2);upd()});slider('m',x=>(+sig(10**x,2))+' kg',x=>{M=+sig(10**x,2);upd()});
document.getElementById('ex').onclick=()=>{const e=document.getElementById('e'),m=document.getElementById('m');m.value=Math.log10(50);e.value=Math.log10(.1);[e,m].forEach(i=>i.dispatchEvent(new Event('input')))};
upd();
let acc=0;const tracks=[];
IX.anims.push((t,dt)=>{const H=E/M*W,L=Math.max(LMIN,Math.min(LMAX,Math.log10(H)));shown+=(L-shown)*Math.min(1,dt*5);ptr.setAttribute('transform',`translate(${lx(shown)},${SY-2})`);
 const pa=lx(shown)>SX+SW-60?'end':lx(shown)<SX+60?'start':'middle';pl.setAttribute('text-anchor',pa);
 // ionisation tracks: rate grows with dose, alpha leaves short dense tracks
 const sdt=IX.play?dt*IX.speed:0;acc+=sdt*Math.min(8,1+Math.max(0,Math.log10(E/M)+6)*1.1);
 while(acc>1){acc--;const g=el('g',{},io),x=40+Math.random()*700,y=20+Math.random()*90;
  if(K==='a'){for(let i=0;i<14;i++)el('circle',{cx:x+i*4,cy:y+Math.sin(i)*1.5,r:3,fill:'#f87171'},g)}
  else{const ang=Math.random()*.6-.3;for(let i=0;i<4;i++)el('circle',{cx:x+i*34*Math.cos(ang),cy:y+i*34*Math.sin(ang),r:3,fill:K==='b'?'#7dd3fc':'#fbb040'},g)}
  tracks.push([g,1.2])}
 for(let i=tracks.length-1;i>=0;i--){tracks[i][1]-=sdt;tracks[i][0].setAttribute('opacity',Math.max(0,tracks[i][1]/1.2));if(tracks[i][1]<=0){tracks[i][0].remove();tracks.splice(i,1)}}});
</script>
