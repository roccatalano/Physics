<!--{"id":"12-4B-3-charge-circular-path","section":"4B","year":12,"title":"Charges in a magnetic field: r = mv/qB","criteria":["U3 AoS2: force on a moving charge F = qvB","U3 AoS2: circular path r = mv/qB, mass spectrometer"],
"blurb":"Fire an electron, proton or alpha particle into a magnetic field. F = qvB is always at right angles to v, so the path is a circle of radius r = mv/qB. Mass spectrometer mode separates carbon isotopes.",
"source":"Cambridge VCE Physics Units 3&4, 4B Magnetic fields and forces (pp. 195–227). Uniform field, non-relativistic speeds.","colour":"#f472b6"}-->
<style>.sl{grid-template-columns:30px 1fr 128px}.pt{padding:6px 10px}</style>
<div class="ctx">The magnetic force <b>F = qvB</b> is always at right angles to the velocity. It changes the direction but <b>never the speed</b>, so the particle moves in a circle.</div>
<div class="row" style="flex:1">
 <div class="card plot" style="--c:#f472b6;padding:12px 16px"><h3 id="ptitle">Particle in a magnetic field</h3><svg id="sv" viewBox="0 0 860 470"></svg></div>
 <div class="side">
  <div class="card ctl" style="--c:#fbb040;gap:9px"><h3 style="margin-bottom:2px">Set up</h3>
   <div class="btns"><button class="md on" data-v="one">One particle</button><button class="md" data-v="ms">Mass spectrometer</button></div>
   <div class="btns" id="pts"><button class="pt" data-v="e">Electron</button><button class="pt on" data-v="p">Proton</button><button class="pt" data-v="a">Alpha</button></div>
   <div class="sl"><span class="nm">$v$</span><input type="range" id="v" min="1" max="10" step="0.5" value="5"><span class="v" id="vv"></span></div>
   <div class="sl"><span class="nm">$B$</span><input type="range" id="B" min="1" max="10" step="0.5" value="4"><span class="v" id="Bv"></span></div>
   <div class="btns"><button id="bd">B into page ⊗</button><button id="fire" style="background:#4ade80;color:#0d1330;border-color:#4ade80">Fire ▶</button></div>
  </div>
  <div class="card out" style="--c:#4ade80;font-size:18px;line-height:1.5;padding:10px 18px">
   <div>$qvB=\dfrac{mv^2}{r}$, so $r=\dfrac{mv}{qB}$</div><div id="calc"></div>
  </div>
 </div>
</div>
<script>
const sv=document.getElementById('sv'),e=1.6e-19,u=1.66e-27;let mode='one',pk='p',vs=5,Bs=4,Bin=1,t0=0;
const P={e:{n:'electron',q:-e,m:9.1e-31,c:'#60a5fa',s:'e⁻',v:2e6,B:1e-3,Bu:'mT',sc:13000},p:{n:'proton',q:e,m:1.67e-27,c:'#f472b6',s:'p⁺',v:1e5,B:.05,Bu:'T',sc:6000},a:{n:'alpha particle',q:2*e,m:6.64e-27,c:'#fbb040',s:'α',v:1e5,B:.05,Bu:'T',sc:6000}};
const ISO=[['¹²C⁺',12,'#7dd3fc'],['¹³C⁺',13,'#4ade80'],['¹⁴C⁺',14,'#fbb040']];
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sci(v,n=3){const x=Math.floor(Math.log10(Math.abs(v)));let ms=(v/Math.pow(10,x)).toFixed(n-1);return x===0?ms:ms+' × 10'+String(x).split('').map(c=>SUP[c]).join('')}
function mk(id,c){const m=el('marker',{id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:4,markerHeight:4,orient:'auto'},el('defs',{},sv));el('path',{d:'M0 0L10 5L0 10z',fill:c},m)}
mk('ag','#4ade80');mk('ay','#fbb040');
const FX=230,FY=15,FW=615,FH=440;
const bg=el('g',{},sv),paths=el('g',{},sv),live=el('g',{},sv),lab=el('g',{},sv);
const dot=el('circle',{r:12},live),dT=txt(live,0,0,'',{'text-anchor':'middle','font-size':13,'font-weight':700,fill:'#0d1330'});
const vA=el('line',{stroke:'#4ade80','stroke-width':5,'marker-end':'url(#ag)'},live),fA=el('line',{stroke:'#fbb040','stroke-width':5,'marker-end':'url(#ay)'},live);
const vL=txt(live,0,0,'v',{fill:'#4ade80','font-size':18,'font-weight':700}),fL=txt(live,0,0,'F',{fill:'#fbb040','font-size':18,'font-weight':700});
let tracks=[];
// path: start (x,y) px, velocity dir (dx,dy), circle radius px, turn sense s (+1 = anticlockwise on screen), inside field box until exit
function build(x,y,dx,dy,R,s){const pts=[[x,y]];const step=2;let ux=dx,uy=dy;const dA=step/R;
 for(let i=0;i<4000;i++){const inF=x>=FX&&x<=FX+FW&&y>=FY&&y<=FY+FH;if(inF){const c=Math.cos(dA),sn=Math.sin(dA)*s;// screen anticlockwise: rotate by -angle in y-down coords
   const nx=ux*c+uy*sn,ny=-ux*sn+uy*c;ux=nx;uy=ny}x+=ux*step;y+=uy*step;pts.push([x,y,ux,uy]);if(x<-20||x>880||y<-20||y>490)break;if(inF&&i>20&&Math.hypot(x-pts[0][0],y-pts[0][1])<2)break}
 pts[0].push(dx,dy);return pts}
function draw(){bg.innerHTML='';paths.innerHTML='';lab.innerHTML='';tracks=[];
 el('rect',{x:FX,y:FY,width:FW,height:FH,fill:'#a78bfa','fill-opacity':.06,stroke:'#a78bfa','stroke-opacity':.4,'stroke-width':2,rx:8},bg);
 for(let x=FX+30;x<FX+FW;x+=60)for(let y=FY+30;y<FY+FH;y+=60){if(Bin>0)el('path',{d:`M${x-6} ${y-6}L${x+6} ${y+6}M${x+6} ${y-6}L${x-6} ${y+6}`,stroke:'#a78bfa','stroke-opacity':.55,'stroke-width':2.5},bg);else{el('circle',{cx:x,cy:y,r:7,fill:'none',stroke:'#a78bfa','stroke-opacity':.55,'stroke-width':2},bg);el('circle',{cx:x,cy:y,r:2.5,fill:'#a78bfa','fill-opacity':.7},bg)}}
 txt(bg,FX+FW-12,FY+26,'B '+(Bin>0?'into':'out of')+' page',{'text-anchor':'end','font-size':16,fill:'#c4b5fd','font-weight':700});
 const c=document.getElementById('calc');
 if(mode==='one'){const p=P[pk],v=vs*p.v,B=Bs*p.B,r=p.m*v/(Math.abs(p.q)*B),R=r*p.sc;
  // positive charge, v to the right, B into page -> force up (screen) -> anticlockwise on screen
  const s=Math.sign(p.q)*Bin;const y0=FY+FH/2;
  tracks=[{pts:build(40,y0,1,0,R,s),c:p.c,s:p.s}];
  el('line',{x1:40,x2:FX,y1:y0,y2:y0,stroke:'#5b6690','stroke-width':2,'stroke-dasharray':'4 6'},bg);txt(bg,40,y0-20,'source',{fill:'#7f8bb5','font-size':15});
  // scale bar
  const cm=p.sc*.01;el('line',{x1:30,x2:30+cm,y1:440,y2:440,stroke:'#a5b4d8','stroke-width':3},bg);txt(bg,30,428,'1 cm',{fill:'#a5b4d8','font-size':15});
  const T=2*Math.PI*p.m/(Math.abs(p.q)*B);
  c.innerHTML=`r = <b class="hi">${r<.01?sig(r*1000,3)+' mm':sig(r*100,3)+' cm'}</b><br>F = qvB = <b>${sci(Math.abs(p.q)*v*B)} N</b><br><span style="font-size:16px;color:#a5b4d8">${p.q<0?'Negative charge: it curves the opposite way to a positive one.':'Right-hand slap rule: fingers along B, thumb along v, palm pushes a + charge.'}</span>`;
  document.getElementById('ptitle').textContent=`A ${p.n} enters the field`.replace('A a','An a').replace('A e','An e');
  document.getElementById('vv').textContent=sci(v,2)+' m s⁻¹';document.getElementById('Bv').textContent=p.Bu==='mT'?sig(B*1000,2)+' mT':sig(B,2)+' T';}
 else{const v=vs*2e4,B=.1+(Bs-1)/9*.3,sc=2500,y0=FY+FH-10,x0=Bin>0?FX+FW-40:FX+40;
  el('rect',{x:FX,y:y0,width:FW,height:12,fill:'#94a3b8'},bg);
  el('rect',{x:x0-6,y:y0,width:12,height:14,fill:'#0d1330'},bg);
  el('line',{x1:x0,x2:x0,y1:y0+50,y2:y0,stroke:'#5b6690','stroke-width':2,'stroke-dasharray':'4 6'},bg);
  const s=Bin;let html='';
  ISO.forEach(([n,A,col],i)=>{const r=A*u*v/(e*B),R=r*sc;const pts=build(x0,y0+40,0,-1,R,s);tracks.push({pts,c:col,s:n});
   const xl=x0-Bin*2*R;if(xl<FX+FW&&xl>FX){el('line',{x1:xl,x2:xl,y1:y0-14,y2:y0+12,stroke:col,'stroke-width':4},lab);txt(lab,xl,y0-20-i*20,n,{'text-anchor':'middle','font-size':15,fill:col,'font-weight':700})}
   html+=`<span style="color:${col}">${n}</span>: 2r = <b>${sig(2*r*100,3)} cm</b><br>`});
  c.innerHTML=`v = ${sci(v,2)} m s⁻¹, B = ${sig(B,2)} T<br>${html}<span style="font-size:16px;color:#a5b4d8">Same q, v, B: <b>heavier ions curve less.</b></span>`;
  document.getElementById('ptitle').textContent='Mass spectrometer: carbon ions hit the grey detector';
  document.getElementById('vv').textContent=sci(v,2)+' m s⁻¹';document.getElementById('Bv').textContent=sig(B,2)+' T';}
 tracks.forEach(t=>{t.el=el('path',{fill:'none',stroke:t.c,'stroke-width':3,'stroke-opacity':.85},paths)});
 t0=IX.t}
group('.md',v=>{mode=v;document.getElementById('pts').style.display=mode==='one'?'':'none';if(mode==='ms'&&Bin<0){}draw()});
group('.pt',v=>{pk=v;draw()});
slider('v',null,v=>{vs=v;draw()});slider('B',null,v=>{Bs=v;draw()});
document.getElementById('bd').onclick=ev=>{Bin=-Bin;ev.target.textContent=Bin>0?'B into page ⊗':'B out of page ⊙';draw()};
document.getElementById('fire').onclick=()=>{t0=IX.t};draw();
IX.anims.push(t=>{const k=Math.floor((t-t0)*260/2);let shown=false;
 tracks.forEach((tr,i)=>{const n=Math.min(tr.pts.length-1,Math.max(0,k));tr.el.setAttribute('d',tr.pts.slice(0,n+1).map((p,j)=>(j?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(''));
  if(mode==='one'||i===0){const p=tr.pts[n];const vis=n<tr.pts.length-1;dot.style.display=dT.style.display=vis?'':'none';
   dot.setAttribute('cx',p[0]);dot.setAttribute('cy',p[1]);dot.setAttribute('fill',tr.c);dT.setAttribute('x',p[0]);dT.setAttribute('y',p[1]+5);dT.textContent=tr.s.length<3?tr.s:'';
   const ux=p[2]||1,uy=p[3]||0,inF=p[0]>=FX&&p[0]<=FX+FW&&p[1]>=FY&&p[1]<=FY+FH;
   vA.setAttribute('x1',p[0]+ux*14);vA.setAttribute('y1',p[1]+uy*14);vA.setAttribute('x2',p[0]+ux*60);vA.setAttribute('y2',p[1]+uy*60);vL.setAttribute('x',p[0]+ux*72-5);vL.setAttribute('y',p[1]+uy*72+6);
   const s=mode==='one'?Math.sign(P[pk].q)*Bin:Bin;const fx=uy*s,fy=-ux*s; // perpendicular, towards centre
   [fA,fL].forEach(q=>q.style.display=inF&&vis?'':'none');[vA,vL].forEach(q=>q.style.display=vis?'':'none');
   fA.setAttribute('x1',p[0]+fx*14);fA.setAttribute('y1',p[1]+fy*14);fA.setAttribute('x2',p[0]+fx*55);fA.setAttribute('y2',p[1]+fy*55);fL.setAttribute('x',p[0]+fx*68-5);fL.setAttribute('y',p[1]+fy*68+6)}})});
</script>
