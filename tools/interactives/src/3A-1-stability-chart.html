"blurb":"Every stable nucleus up to lead on an N against Z chart. Tap any square to read N, Z, A and N/Z, and see why heavy nuclei need extra neutrons.",
"source":"Cambridge VCE Physics Units 1&2, 3A Nuclear stability (Figure 3A–7). Stable = no observed decay. Decay mode is the usual one for that region.","colour":"#7dd3fc"}-->
<div class="ctx">Each <b>blue square</b> is a stable nucleus. Heavy nuclei need <b>more neutrons than protons</b>.</div>
<div class="row" style="flex:1">
 <div class="card plot" style="--c:#7dd3fc"><h3>Neutron number N against proton number Z</h3><svg id="sv" viewBox="0 0 780 440"></svg></div>
 <div class="side">
  <div class="card ctl" style="--c:#fbb040"><h3>Pick or tap a nucleus</h3>
   <div class="btns"><button class="nb" data-v="6,6">C-12</button><button class="nb" data-v="6,8">C-14</button><button class="nb" data-v="26,30">Fe-56</button><button class="nb" data-v="27,33">Co-60</button><button class="nb" data-v="9,9">F-18</button><button class="nb" data-v="82,126">Pb-208</button><button class="nb" data-v="92,146">U-238</button></div>
  </div>
  <div class="card out" style="--c:#4ade80"><h3>Readout</h3><div id="ro" style="font-size:20px;line-height:1.5"></div></div>
  <div class="rule">Above the belt: <b>β⁻</b>. Below it: <b>β⁺</b>. Past Z = 82: <b>α</b>.</div>
 </div>
</div>
<script>
const SYM='n H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am'.split(' ');
const ST={1:[1,2],2:[3,4],3:[6,7],4:[9],5:[10,11],6:[12,13],7:[14,15],8:[16,17,18],9:[19],10:[20,21,22],11:[23],12:[24,25,26],13:[27],14:[28,29,30],15:[31],16:[32,33,34,36],17:[35,37],18:[36,38,40],19:[39,41],20:[40,42,43,44,46],21:[45],22:[46,47,48,49,50],23:[51],24:[50,52,53,54],25:[55],26:[54,56,57,58],27:[59],28:[58,60,61,62,64],29:[63,65],30:[64,66,67,68,70],31:[69,71],32:[70,72,73,74],33:[75],34:[74,76,77,78,80],35:[79,81],36:[78,80,82,83,84,86],37:[85],38:[84,86,87,88],39:[89],40:[90,91,92,94],41:[93],42:[92,94,95,96,97,98],44:[96,98,99,100,101,102,104],45:[103],46:[102,104,105,106,108,110],47:[107,109],48:[106,108,110,111,112,114],49:[113],50:[112,114,115,116,117,118,119,120,122,124],51:[121,123],52:[120,122,123,124,125,126],53:[127],54:[126,128,129,130,131,132,134],55:[133],56:[132,134,135,136,137,138],57:[139],58:[136,138,140,142],59:[141],60:[142,143,145,146,148],62:[144,149,150,152,154],63:[153],64:[154,155,156,157,158,160],65:[159],66:[156,158,160,161,162,163,164],67:[165],68:[162,164,166,167,168,170],69:[169],70:[168,170,171,172,173,174,176],71:[175],72:[176,177,178,179,180],73:[181],74:[182,183,184,186],75:[185],76:[184,187,188,189,190,192],77:[191,193],78:[192,194,195,196,198],79:[197],80:[196,198,199,200,201,202,204],81:[203,205],82:[204,206,207,208]};
const stable=new Set();for(const z in ST)ST[z].forEach(a=>stable.add(z+','+(a-z)));
const sv=document.getElementById('sv'),X0=62,Y0=400,ZM=95,NM=150,CW=700/ZM,CH=380/NM;
const X=z=>X0+z*CW,Y=n=>Y0-n*CH;
for(let z=0;z<=ZM;z+=10){el('line',{x1:X(z),x2:X(z),y1:Y0,y2:Y(NM),stroke:'#232c63'},sv);txt(sv,X(z),Y0+24,z,{fill:'#8b96c0','font-size':18,'text-anchor':'middle'})}
for(let n=0;n<=NM;n+=25){el('line',{x1:X0,x2:X(ZM),y1:Y(n),y2:Y(n),stroke:'#232c63'},sv);txt(sv,X0-10,Y(n)+6,n,{fill:'#8b96c0','font-size':17,'text-anchor':'end'})}
txt(sv,X(ZM)-30,Y0-10,'Z (protons)',{fill:'#cfd7f5','font-size':18,'text-anchor':'end'});
txt(sv,X0+10,Y(NM)+4,'N (neutrons)',{fill:'#cfd7f5','font-size':18});
el('line',{x1:X(0),y1:Y(0),x2:X(ZM),y2:Y(ZM),stroke:'#fbb040','stroke-width':2.5,'stroke-dasharray':'8 6'},sv);
txt(sv,X(ZM)-4,Y(ZM)-12,'N = Z',{fill:'#fbb040','font-size':19,'text-anchor':'end'});
el('rect',{x:X(82.5),y:Y(NM),width:X(ZM)-X(82.5),height:Y0-Y(NM),fill:'#f472b6','fill-opacity':.08},sv);
txt(sv,X(89),Y(30),'Z > 82',{fill:'#f472b6','font-size':17,'text-anchor':'middle'});txt(sv,X(89),Y(30)+22,'none stable',{fill:'#f472b6','font-size':15,'text-anchor':'middle'});
stable.forEach(k=>{const[z,n]=k.split(',').map(Number);el('rect',{x:X(z)-CW/2,y:Y(n)-CH/2,width:CW+.4,height:CH+.6,fill:'#7dd3fc'},sv)});
const sel=el('rect',{width:18,height:18,fill:'none',stroke:'#fbb040','stroke-width':3.5},sv);
const lab=txt(sv,0,0,'',{fill:'#fff','font-size':20,'font-weight':700});
let Z=26,N=30;
function show(z,n){Z=z;N=n;const A=z+n,s=stable.has(z+','+n);
 sel.setAttribute('x',X(z)-9);sel.setAttribute('y',Y(n)-9);lab.textContent=SYM[z]+'-'+A;lab.setAttribute('x',X(z)+(z>70?-16:14));lab.setAttribute('y',Y(n)-12);lab.setAttribute('text-anchor',z>70?'end':'start');
 // centre of the stable band at this Z
 let mid=null;if(ST[z]){const ns=ST[z].map(a=>a-z);mid=(Math.min(...ns)+Math.max(...ns))/2}else{for(let d=1;d<5&&mid==null;d++){for(const zz of[z-d,z+d])if(ST[zz]){const ns=ST[zz].map(a=>a-zz);mid=(Math.min(...ns)+Math.max(...ns))/2+(z-zz)*1.5;break}}}
 let fate;if(s)fate='<span class="gr">Stable</span>';else if(z>82)fate='<span class="pk">Unstable</span>: usually α decay';else if(mid!=null&&n>mid)fate='<span class="pk">Unstable</span>: too many neutrons, β⁻';else fate='<span class="pk">Unstable</span>: too few neutrons, β⁺';
 document.getElementById('ro').innerHTML=`<div class="big">${SYM[z]}-${A}</div>Z = <b>${z}</b>, N = <b>${n}</b>, A = <b>${A}</b><br>N/Z = <b class="hi">${z?sig(n/z):'∞'}</b><br>${fate}`}
group(".nb",v=>{const[z,n]=v.split(',').map(Number);show(z,n)});
sv.addEventListener('click',e=>{const p=sv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(sv.getScreenCTM().inverse());
 const z=Math.round((q.x-X0)/CW),n=Math.round((Y0-q.y)/CH);if(z<1||z>ZM||n<0||n>NM)return;
 // snap to nearest stable square if close
 let best=null,bd=9;stable.forEach(k=>{const[a,b]=k.split(',').map(Number);const d=Math.hypot(a-z,(b-n)*CH/CW);if(d<bd){bd=d;best=[a,b]}});
 document.querySelectorAll(".nb").forEach(b=>b.classList.remove('on'));if(best&&bd<1.6)show(...best);else show(z,n)});
document.querySelector('.nb[data-v="26,30"]').click();
IX.anims.push(t=>sel.setAttribute('stroke-opacity',.6+.4*Math.sin(t*5)));
</script>
