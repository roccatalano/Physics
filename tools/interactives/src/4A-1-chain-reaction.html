<!--{"id":"4A-1-chain-reaction","section":"4A","title":"Fission chain reaction","criteria":["4A.3","4A.4"],
"blurb":"Neutrons from each U-235 fission go on to split more nuclei, escape, or get soaked up by control rods. Change fuel size, rods and moderator to make the reaction subcritical, critical or supercritical.",
"source":"Cambridge VCE Physics Units 1&2, 4A Nuclear energy (chain reactions, critical mass, control rods). Simplified model: fixed chance of each fate.","colour":"#fbb040"}-->
<div class="ctx">Each U-235 fission releases <b>2 or 3 neutrons</b> (2.5 on average). What happens to them decides whether the chain reaction <b>dies out, holds steady or runs away</b>.</div>
<div class="row" style="flex:1">
 <div class="card plot" style="--c:#fbb040"><h3 id="ptitle">Reactor core and neutron count</h3><svg id="sv" viewBox="0 0 860 380"></svg><div class="rule" id="rule" style="font-size:17px;padding:8px 14px"></div></div>
 <div class="side">
  <div class="card ctl" style="--c:#7dd3fc"><h3>Controls</h3>
   <div class="sl" style="grid-template-columns:112px 1fr 64px"><span class="nm">Fuel size</span><input type="range" id="r" min="1" max="3" step="0.1" value="2"><span class="v" id="rv"></span></div>
   <div class="sl" style="grid-template-columns:112px 1fr 64px"><span class="nm">Control rods</span><input type="range" id="x" min="0" max="100" step="1" value="36"><span class="v" id="xv"></span></div>
   <div class="btns"><button id="mod">Moderator</button><button id="rs">Restart</button></div>
   <div class="btns"><button class="pr" data-v="sub">Subcritical</button><button class="pr" data-v="crit">Critical</button><button class="pr" data-v="sup">Supercritical</button></div>
  </div>
  <div class="card out" style="--c:#4ade80;font-size:18px;line-height:1.45"><h3>Of every 2.5 neutrons</h3>
   <div><span class="pk">escape</span> <b id="oe"></b> · <span style="color:#9aa3c7">absorbed</span> <b id="oa"></b> · no fission <b id="on"></b></div>
   <div><span class="hi">cause a fission</span> <span class="big" id="ok"></span></div>
   <div id="st" style="font:700 22px 'Space Grotesk'"></div>
  </div>
 </div>
</div>
<script>
const sv=document.getElementById('sv'),CX=210,CY=200,NU=2.5,GT=1.1,GMAX=25,NMAX=1e6;
let r=2,x=.36,mod=true,k=1,P={};
// core
const core=el('circle',{cx:CX,cy:CY,fill:'#22305f',stroke:'#7dd3fc','stroke-width':3},sv);
const fuel=el('g',{},sv);const rods=[0,1,2].map(()=>el('rect',{width:14,rx:4,fill:'#9aa3c7'},sv));
const dg=el('g',{},sv);const fg=el('g',{},sv);
txt(sv,CX,374,'U-235 fuel (top view, rods enter from above)',{'text-anchor':'middle','font-size':16,fill:'#a5b4d8'});
// graph
const GX=490,GW=340,GY=40,GH=280,gy=n=>GY+GH-GH*Math.log10(Math.max(n,1))/6,gx=g=>GX+GW*g/GMAX;
el('line',{x1:GX,y1:GY,x2:GX,y2:GY+GH,stroke:'#6b78b0','stroke-width':2},sv);el('line',{x1:GX,y1:GY+GH,x2:GX+GW,y2:GY+GH,stroke:'#6b78b0','stroke-width':2},sv);
['1','10','100','1000','10⁴','10⁵','10⁶'].forEach((s,i)=>{const y=GY+GH-GH*i/6;el('line',{x1:GX,x2:GX+GW,y1:y,y2:y,stroke:'#2c3670'},sv);txt(sv,GX-8,y+6,s,{'text-anchor':'end','font-size':16,fill:'#a5b4d8'})});
[0,5,10,15,20,25].forEach(g=>txt(sv,gx(g),GY+GH+22,g,{'text-anchor':'middle','font-size':16,fill:'#a5b4d8'}));
txt(sv,GX+GW/2,GY+GH+46,'generation',{'text-anchor':'middle','font-size':17,fill:'#cfd7f5'});
txt(sv,GX,GY-14,'neutrons in each generation (log scale)',{'font-size':17,fill:'#cfd7f5'});
const gl=el('polyline',{fill:'none',stroke:'#fbb040','stroke-width':4,'stroke-linejoin':'round'},sv);
const msg=txt(sv,GX+GW/2,GY+GH/2,'',{'text-anchor':'middle','font-size':22,'font-weight':700});
// model
function calc(){const R=50+(r-1)*55;core.setAttribute('r',R);
 const pl=.5/r,pa=.8*x,pf=mod?.75:.3;
 P={l:pl,a:(1-pl)*pa,f:(1-pl)*(1-pa)*pf};P.n=1-P.l-P.a-P.f;k=NU*P.f;
 document.getElementById('oe').textContent=f2(NU*P.l);document.getElementById('oa').textContent=f2(NU*P.a);document.getElementById('on').textContent=f2(NU*P.n);document.getElementById('ok').textContent=f2(NU*P.f);
 const s=k<.98?['Subcritical','#7dd3fc','dies out']:k>1.02?['Supercritical','#f472b6','grows']:['Critical','#4ade80','holds steady'];
 const st=document.getElementById('st');st.textContent=s[0]+': reaction '+s[2];st.style.color=s[1];
 document.getElementById('rule').innerHTML=k<.98?'<b>Fewer than 1</b> neutron per fission goes on to cause another fission, so each generation is smaller.':k>1.02?'<b>More than 1</b> neutron per fission causes another fission, so the numbers grow exponentially. Uncontrolled, this is a bomb.':'<b>Exactly 1</b> neutron per fission causes another fission. Neutrons are made as fast as they are lost: a steady reactor.';
 rods.forEach((b,i)=>{const rx=CX+(i-1)*R*.55-7,top=CY-R-30;b.setAttribute('x',rx);b.setAttribute('y',top);b.setAttribute('height',30+x*2*R)});
 fuel.innerHTML='';for(let i=0;i<70;i++){const a=i*2.39996,d=R*.92*Math.sqrt((i+.5)/70);el('circle',{cx:CX+d*Math.cos(a),cy:CY+d*Math.sin(a),r:4,fill:'#4ade80',opacity:.55},fuel)}
}
slider('r',v=>v.toFixed(1)+'×',v=>{r=v;calc()});slider('x',v=>v+'%',v=>{x=v/100;calc()});toggle('mod',v=>{mod=v;calc()},true);
const PR={sub:[2,.7,true],crit:[2,.36,true],sup:[2.6,0,true]};
group('.pr',v=>{const p=PR[v];document.getElementById('r').value=p[0];document.getElementById('x').value=Math.round(p[1]*100);mod=p[2];document.getElementById('mod').classList.toggle('on',mod);
 document.getElementById('r').dispatchEvent(new Event('input'));document.getElementById('x').dispatchEvent(new Event('input'));restart()});
// simulation by generations
let N,gen,hist,t0,dots,end;
function fates(n){// returns counts of each fate for n neutrons
 if(n>4000){return{f:Math.round(n*P.f*(1+(Math.random()-.5)*.02)),l:n*P.l,a:n*P.a}}
 let f=0,l=0,a=0;for(let i=0;i<n;i++){const u=Math.random();if(u<P.f)f++;else if(u<P.f+P.l)l++;else if(u<P.f+P.l+P.a)a++}return{f,l,a}}
function spawn(){dg.innerHTML='';fg.innerHTML='';const R=+core.getAttribute('r');dots=[];const m=Math.min(N,60);
 for(let i=0;i<m;i++){const a0=Math.random()*6.283,d0=R*.8*Math.sqrt(Math.random()),sx=CX+d0*Math.cos(a0),sy=CY+d0*Math.sin(a0),u=Math.random();
  let fate=u<P.f?'f':u<P.f+P.l?'l':u<P.f+P.l+P.a?'a':'n',ex,ey,th=Math.random()*6.283;
  if(fate==='l'){const b=(sx-CX)*Math.cos(th)+(sy-CY)*Math.sin(th),c=(sx-CX)**2+(sy-CY)**2-(R+50)**2,s=-b+Math.sqrt(b*b-c);ex=sx+s*Math.cos(th);ey=sy+s*Math.sin(th)}
  else if(fate==='a'){const i3=Math.floor(Math.random()*3),bx=CX+(i3-1)*R*.55;ex=bx;ey=CY-R+Math.random()*x*2*R}
  else{const d=R*.85*Math.sqrt(Math.random()),a=Math.random()*6.283;ex=CX+d*Math.cos(a);ey=CY+d*Math.sin(a)}
  dots.push({sx,sy,ex,ey,fate,c:el('circle',{r:5,fill:'#eef2ff'},dg),s:fate==='f'?el('circle',{cx:ex,cy:ey,r:0,fill:'#fbb040'},fg):null})}}
function restart(){N=100;gen=0;hist=[N];t0=IX.t;end=0;msg.textContent='';spawn();draw()}
function draw(){gl.setAttribute('points',hist.map((n,g)=>gx(g)+','+gy(n).toFixed(1)).join(' '))}
document.getElementById('rs').onclick=restart;calc();restart();
IX.anims.push(t=>{
 if(end){if(t-end>3)restart();return}
 let u=(t-t0)/GT;
 if(u>=1){const c=fates(N);N=Math.round(c.f*NU);// each fission gives 2 or 3 neutrons (2.5 on average)
  if(c.f<=2000){let s=0;for(let i=0;i<c.f;i++)s+=Math.random()<.5?2:3;N=s}
  gen++;hist.push(Math.min(N,NMAX));draw();t0=t;u=0;
  if(N===0){msg.textContent='Died out';msg.setAttribute('fill','#7dd3fc');end=t;dg.innerHTML='';fg.innerHTML='';return}
  if(N>=NMAX){msg.textContent='Runaway!';msg.setAttribute('fill','#f472b6');end=t;return}
  if(gen>=GMAX){hist=[N];gen=0;draw()}
  spawn()}
 dots.forEach(d=>{const v=Math.min(1,u/.7),X=d.sx+(d.ex-d.sx)*v,Y=d.sy+(d.ey-d.sy)*v;d.c.setAttribute('cx',X);d.c.setAttribute('cy',Y);
  d.c.setAttribute('fill',d.fate==='a'&&v>=1?'#4b5280':d.fate==='l'?'#f472b6':'#eef2ff');d.c.setAttribute('opacity',d.fate==='n'?1-v*.9:d.fate==='l'&&v>=1?Math.max(0,1-(u-.7)*4):1);
  if(d.s){const w=u<.7?0:(u-.7)/.3;d.s.setAttribute('r',w*16);d.s.setAttribute('opacity',1-w*.6)}});
});
</script>
