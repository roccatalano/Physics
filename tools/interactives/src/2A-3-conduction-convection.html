<!--{"id":"2A-3-conduction-convection","section":"2A","title":"Conduction and convection","criteria":["2A.4"],
"blurb":"A rod heated at one end passes vibrations along (conduction). Water heated from below circulates (convection).",
"source":"Cambridge VCE Physics Units 1&2, 2A Thermal energy (pp. 7–10). Particle model only, not to scale; radiation not shown.","colour":"#ef4444"}-->
<div class="ctx">Two ways thermal energy moves through matter. <b>In which one do the particles themselves travel?</b></div>
<div class="row" style="flex:1">
 <div class="card plot" style="--c:#ef4444"><h3 id="pt">Conduction in a rod</h3><svg id="sv" viewBox="0 0 860 380"></svg><div class="rule" id="rule" style="font-size:17px;padding:8px 14px;min-height:78px"></div></div>
 <div class="side">
  <div class="card ctl" style="--c:#fbb040"><h3>Process</h3>
   <div class="btns"><button class="md on" data-v="cd">Conduction</button><button class="md" data-v="cv">Convection</button></div>
   <div class="btns"><button id="ht">Heat on</button><button id="rs">↻ Reset</button></div>
  </div>
  <div class="card ctl" style="--c:#7dd3fc" id="matc"><h3>Rod material</h3>
   <div class="btns"><button class="mt on" data-v="1">Metal</button><button class="mt" data-v="0.12">Wood</button></div>
  </div>
  <div class="card out" style="--c:#4ade80;font-size:19px;line-height:1.5"><h3>What moves?</h3><div id="ro"></div></div>
 </div>
</div>
<script>
const sv=document.getElementById('sv'),gd=el('g',{},sv),gv=el('g',{},sv);let mode='cd',heat=true,kc=1;
const col=T=>`hsl(${220-220*T},85%,${55+5*T}%)`;
function arr(g,x1,y1,x2,y2,c){el('line',{x1,y1,x2,y2,stroke:c,'stroke-width':5,'marker-end':'url(#ah'+c.slice(1)+')'},g)}
const defs=el('defs',{},sv);['#fbb040','#ef4444','#38bdf8'].forEach(c=>{const m=el('marker',{id:'ah'+c.slice(1),viewBox:'0 0 10 10',refX:5,refY:5,markerWidth:4,markerHeight:4,orient:'auto'},defs);el('path',{d:'M0 0L10 5L0 10z',fill:c},m)});
// conduction: lattice
const NC=16,NR=4,CX0=110,DX=44,CY0=130,DY=40,Tc=new Array(NC).fill(0),dots=[];
el('rect',{x:CX0-26,y:CY0-26,width:DX*(NC-1)+52,height:DY*(NR-1)+52,rx:10,fill:'none',stroke:'#5b6690','stroke-width':2},gd);
for(let c=0;c<NC;c++)for(let r=0;r<NR;r++)dots.push({c,r,ph:Math.random()*6.3,ph2:Math.random()*6.3,e:el('circle',{r:12},gd)});
const fl=el('path',{fill:'#fb923c'},gd);txt(gd,CX0,372,'flame',{'text-anchor':'middle',fill:'#fb923c'});
arr(gd,250,50,620,50,'#fbb040');txt(gd,435,35,'heat flows from hot to cold',{'text-anchor':'middle',fill:'#fbb040'});
const tl=[0,1,2,3].map(i=>txt(gd,CX0+i*5*DX,CY0-38,'',{'text-anchor':'middle','font-size':17,fill:'#cfd7f5'}));
// convection: pot
const PX=200,PY=60,PW=460,PH=240,NP=46,parc=[];
el('rect',{x:PX,y:PY,width:PW,height:PH,rx:12,fill:'#101640',stroke:'#cfd7f5','stroke-width':4},gv);
const hb=el('rect',{x:PX+PW/2-70,y:PY+PH+10,width:140,height:20,rx:8},gv);
txt(gv,PX+PW/2,PY+PH+58,'heater',{'text-anchor':'middle',fill:'#fb923c'});
txt(gv,PX-14,PY+PH/2,'cool water',{'text-anchor':'end',fill:'#38bdf8'});txt(gv,PX-14,PY+PH/2+24,'sinks',{'text-anchor':'end',fill:'#38bdf8'});
txt(gv,PX+PW+14,PY+PH/2,'cool water',{fill:'#38bdf8'});txt(gv,PX+PW+14,PY+PH/2+24,'sinks',{fill:'#38bdf8'});
const lb=txt(gv,PX+PW/2,PY-16,'warm water rises (less dense)',{'text-anchor':'middle',fill:'#ef4444'});
// loop path: half-cell on each side. s in [0,1): up the middle, across top, down the wall, back along bottom
function loopPos(s,side,inset){const L=PW/2-30-inset,H=PH-40-2*inset,per=2*(L+H);let d=s*per,x,y,cx=PX+PW/2,top=PY+20+inset,bot=PY+PH-20-inset;
 if(d<H){x=0;y=bot-d}else if((d-=H)<L){x=d;y=top}else if((d-=L)<H){x=L;y=top+d}else{d-=H;x=L-d;y=bot}
 return[cx+side*(15+inset+x),y]}
for(let i=0;i<NP;i++)parc.push({s:Math.random(),side:i%2?1:-1,in:(i%3)*28,T:.2,e:el('circle',{r:11},gv)});
function reset(){Tc.fill(0);parc.forEach(p=>p.T=.15)}
function setMode(v){mode=v;gd.style.display=v==='cd'?'':'none';gv.style.display=v==='cv'?'':'none';document.getElementById('matc').style.visibility=v==='cd'?'':'hidden';
 document.getElementById('pt').textContent=v==='cd'?'Conduction in a rod':'Convection in a pot of water';
 document.getElementById('rule').innerHTML=v==='cd'?'<b>Conduction:</b> hot particles vibrate harder and bump their neighbours. Energy passes along, <b>the particles stay in place</b>. Main process in solids; metals are fast because free electrons help.':'<b>Convection:</b> water near the heater warms, expands and becomes less dense, so it rises; cooler, denser water sinks to replace it. <b>The fluid itself moves</b> and carries the energy.';
 document.getElementById('ro').innerHTML=v==='cd'?'Only <b>energy</b> moves along the rod. Each particle vibrates about a fixed spot.':'<b>The water moves</b>, carrying thermal energy with it. Happens in liquids and gases.'}
group('.md',setMode);group('.mt',v=>{kc=+v});toggle('ht',v=>{heat=v},true);document.getElementById('rs').onclick=reset;setMode('cd');reset();
IX.anims.push((t,dt)=>{const h=IX.play?dt*IX.speed:0;
 if(mode==='cd'){for(let k=0;k<20;k++){const n=Tc.slice();for(let i=0;i<NC;i++){const l=i?Tc[i-1]:Tc[i],r=i<NC-1?Tc[i+1]:Tc[i];n[i]+=kc*1.4*(l+r-2*Tc[i])*h/20-.004*Tc[i]*h/20}if(heat)n[0]=Math.min(1,n[0]+3*h/20);Tc.splice(0,NC,...n)}
  dots.forEach(d=>{const T=Tc[d.c],a=2+9*T,w=14;d.e.setAttribute('cx',CX0+d.c*DX+a*Math.sin(w*t+d.ph));d.e.setAttribute('cy',CY0+d.r*DY+a*Math.sin(w*1.3*t+d.ph2));d.e.setAttribute('fill',col(T))});
  const fh=heat?30+6*Math.sin(t*20):0;fl.setAttribute('d',heat?`M${CX0-24},345Q${CX0},${345-fh*2} ${CX0+24},345Z`:'');
  tl.forEach((e,i)=>e.textContent=Math.round(20+380*Tc[i*5])+' °C')}
 else{hb.setAttribute('fill',heat?'#ef4444':'#36418a');lb.style.opacity=heat?1:.3;
  parc.forEach(p=>{const sp=heat?.05+.06*p.T:.01;p.s=(p.s+sp*h)%1;const[x,y]=loopPos(p.s,p.side,p.in);
   const nearHeat=y>PY+PH-60&&Math.abs(x-(PX+PW/2))<90;const coolZ=y<PY+50||Math.abs(x-(PX+PW/2))>PW/2-60;p.T+=h*(heat&&nearHeat?4*(1-p.T):coolZ?-.5*p.T:-.04*p.T);p.T=Math.max(0,Math.min(1,p.T));
   p.e.setAttribute('cx',x);p.e.setAttribute('cy',y);p.e.setAttribute('fill',col(p.T))})}});
</script>
