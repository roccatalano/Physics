<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
{{FONTS}}
{{KATEX_CSS}}
@page { size: A4; margin: {{MARGIN}}; }
* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { margin: 0; font-family: Inter, sans-serif; font-size: {{FONT}}; line-height: {{LH}}; color: #000; }
.page { width: 100%; }
.sheet { break-after: page; }
.sheet:last-child { break-after: auto; }
.katex { font-size: 1.04em; line-height: 1; }
b { font-weight: 700; }

/* header (same as the checklist) */
.top { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1.6pt solid #000; padding-bottom: 1.6mm; }
.top h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 19pt; margin: 0; line-height: 1; }
.top .sub { font-size: 8.5pt; margin-top: 1.2mm; }
.top .name { font-size: 10pt; white-space: nowrap; }
.top .name span { display: inline-block; width: 58mm; border-bottom: 0.8pt solid #000; margin-left: 2mm; }

/* constants strip */
.consts { display: flex; flex-wrap: wrap; gap: 0.6mm 0; border-bottom: 0.6pt solid #000; padding: 1.1mm 0; font-size: 8.5pt; }
.consts .ch { font-family: 'Space Grotesk', sans-serif; font-weight: 700; margin-right: 2.5mm; }
.consts .c { white-space: nowrap; }
.consts .c + .c::before { content: ""; display: inline-block; width: 1pt; height: 2.6mm; background: #000; margin: 0 2.2mm; vertical-align: -0.35mm; }

/* layout rows */
.row { display: grid; column-gap: {{GAP}}; margin-top: {{ROWGAP}}; }
.row.full { display: block; }
.col > *:first-child { margin-top: 0; }

/* section and sub headings */
.sec { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.2pt solid #000; padding-bottom: 0.5mm; margin: 0 0 1.0mm; break-after: avoid; }
.sec .nm { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11.5pt; }
.sec .cr { font-size: 8.5pt; }
.sh { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 9.6pt; margin: 1.4mm 0 0.3mm; }

/* dot points */
ul.pts { margin: 0; padding: 0; list-style: none; }
ul.pts li { margin: 0 0 {{LI}}; padding-left: 3.2mm; position: relative; }
ul.pts li::before { content: ""; position: absolute; left: 0.7mm; top: 0.43em; width: 1.05mm; height: 1.05mm; border-radius: 50%; background: #000; }

/* formula box */
.fm { border: 1pt solid #000; border-radius: 1.2mm; padding: 1.1mm 2mm 1.2mm; margin: 1.2mm 0; break-inside: avoid; }
.fm .eqs { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6mm 7mm; font-size: 10.2pt; }
.fm .eqs > span { white-space: nowrap; }
.fm .eqs .lab { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 8.8pt; }
.fm .where { display: grid; grid-template-columns: max-content 1fr; column-gap: 2mm; row-gap: 0.1mm; margin-top: 0.8mm; padding-top: 0.8mm; border-top: 0.5pt solid #888; }
.fm .where .s { text-align: right; }

/* figures */
.fig { margin: 1.2mm 0; text-align: center; break-inside: avoid; }
.fig svg, .fig img { display: block; margin: 0 auto; }
.fig .cap { font-size: 8.5pt; margin-top: 0.4mm; }
.side { display: grid; column-gap: 2.5mm; align-items: start; margin: 1.0mm 0; }
.side > * { margin-top: 0 !important; }

/* scale strip (e.g. the EM spectrum): boundary labels above and below a row of cells */
.strip { margin: 0.6mm 0 0.6mm; break-inside: avoid; }
.strip .cells { display: grid; border: 0.8pt solid #000; }
.strip .cell { border-left: 0.6pt solid #000; padding: 0.5mm 0.8mm 0.6mm; text-align: center; }
.strip .cell:first-child { border-left: 0; }
.strip .cell .cn { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 9pt; }
.strip .bl { position: relative; height: 4.3mm; }
.strip .bl > span { position: absolute; transform: translateX(-50%); white-space: nowrap; bottom: 0.3mm; }
.strip .bl.b > span { bottom: auto; top: 0.3mm; }
.strip .bl > .lab { transform: none; font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
.strip .bl > .tk { width: 0; height: 1.2mm; border-left: 0.6pt solid #000; transform: none; bottom: -0.1mm; }
.strip .bl.b > .tk { top: -0.1mm; }

/* table */
table.tb { width: 100%; border-collapse: collapse; margin: 0.6mm 0 0.8mm; table-layout: fixed; }
table.tb th, table.tb td { border: 0.6pt solid #000; padding: 0.25mm 0.7mm; text-align: left; vertical-align: middle; }
table.tb th { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 9pt; }
table.tb td.rh, table.tb th.rh { text-align: left; font-family: 'Space Grotesk', sans-serif; font-weight: 700; }
table.tb th { font-size: 8.5pt; }
.note { margin-top: 0.4mm; }
table.tb .katex { font-size: 1em; }

.foot { border-top: 0.6pt solid #000; margin-top: 1.6mm; padding-top: 0.8mm; font-size: 8.5pt; display: flex; justify-content: space-between; gap: 4mm; }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
