.udcard{background:var(--ac);color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-self:start}.udcard:hover{filter:brightness(1.08)}
.udcard .uc1{color:rgba(255,255,255,.8)}.udcard .uname{font-size:14px;margin:0}.udcard .umeta{color:rgba(255,255,255,.85)}.udcard.open{box-shadow:0 0 0 3px var(--acb),0 0 0 5px var(--ac)}
.udpanel{display:grid;grid-template-columns:1fr 1fr;gap:12px}.udpanel h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:4px 0 6px}
@media(max-width:900px){.udpanel{grid-template-columns:1fr}}.udrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}.udrow:first-child{border-top:0}.udrow .sub{color:var(--muted)}
.udrow .ms{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:8px;background:#e4e4e4;color:#555}.udrow .mlink{font-size:11.5px;font-weight:600;color:#1d7266;text-decoration:none;border:1px solid #9fd8cd;border-radius:8px;padding:1px 7px;margin-left:2px}.udpanel .nb h4{margin:8px 0 2px;font-size:12px}
.evcard.exam{background:#eef0fb;border-color:#9aa3d9;color:#2c3576}.evcard.exam .uc1,.evcard.exam .umeta{color:#4a54a0}
.cpl.cp3{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin-top:4px}.cp3 .cpc{border-color:#c9d6ee}.ccr{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:2px}.ccr>span:last-child{white-space:nowrap;display:flex;gap:3px}.ccr a{white-space:nowrap}.cp3 .cpc{gap:2px}.ccr .sub{font-size:11px;color:var(--muted)}
.nest.n-ld{border-color:var(--lesson-i);background:#f3f6fc}.nest.n-ld>summary{color:var(--lesson-i)}.n-ld .detail{border:0;padding:0;background:transparent;grid-template-columns:1fr}.n-ld .detail h2,.n-ld .detail>div>.meta,.n-ld [data-nest="mat"]{display:none}
.lcard.t-check .nest.n-ld{border-color:var(--sac-i);background:#fdf3f3}.lcard.t-check .nest.n-ld>summary{color:var(--sac-i)}
/* Year plan calendar (Rocco, 16 Nov) */
.cweek{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.cwl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}.cwl b{color:var(--ink);font-size:14px}
.chip{font-size:11px;border-radius:7px;padding:2px 7px;line-height:1.3}.cbl{background:#efece4;color:#6b6656}.csac{background:#fbe3e3;color:#7a1f1f;font-weight:600}.cfx{background:#fdeee0;color:#8a4a12}.cex{background:#e7eafb;color:#2c3576}

.slesson{border-left:6px solid var(--ac);cursor:pointer}.slesson:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}.slesson.open{background:var(--acb);box-shadow:inset 0 0 0 2px var(--ac)}
.slesson.scheck{border-left-color:#a32d2d;background:#fdf6f6}.stags{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}.stags .tag{font-size:11px;padding:1px 7px;border-radius:6px;background:#eef0f3;color:#555}.stags .tag.cfat{background:#efe9fb;color:#5b3fb0;font-weight:600}.stags .tag.chk{background:#fbe3e3;color:#a32d2d}
.sbuf{border-style:dashed;background:transparent;color:var(--muted)}.sbuf .st{font-weight:500}
.ssac{background:#fbeaea;border:1px dashed #d98c8c;color:#7a1f1f}.sfix{background:#fdf3e6;border:1px dashed #e0a96d;color:#7a4510}.snone{grid-column:1/-1;min-height:0;color:var(--muted);font-style:italic;border-style:dashed;background:transparent}
.cdetail{margin:6px 0 10px 160px}@media(max-width:800px){.cweek{grid-template-columns:1fr}.cdetail{margin-left:0}.cslots{grid-template-columns:1fr 1fr}}
.ssplit{display:grid;grid-template-columns:2fr 1fr;gap:6px;padding:0;border:0;background:transparent;min-height:86px}.ssplit>.sin{min-height:0;height:100%}
.sbuf.srev{border:1px dashed #d98c8c;background:#fdf5f5;color:#7a1f1f}.sbuf.sred{border:1px dashed #c9a46a;background:#fdf8ef;color:#7a5410}.sbuf.sexr{border:1px dashed #9aa3d9;background:#f2f3fc;color:#2c3576}.sbuf .sub{color:inherit;opacity:.8;font-size:12px}
.swide{grid-column:1/-1;background:#e7eafb;border:2px solid #9aa3d9;color:#2c3576;align-items:center;justify-content:center;text-align:center}.swide .st{font-size:20px}
.ybar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}.ybar button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;cursor:pointer}.ybar button.on{background:var(--ink);color:#fff}.ybar i{font-style:normal;font-size:11px;opacity:.7}
.ttw{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.ttd{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tday{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:3px;min-height:60px}.tday.out{background:transparent;border:0}.tday.off{background:#efece4}
.tdh{font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:2px}.tdh .why{font-weight:500;font-size:10.5px;background:#efece4;border-radius:5px;padding:1px 4px;color:#6b6656}.tdh .why.sac{background:#fbe3e3;color:#7a1f1f}
.tses{display:flex;gap:3px;align-items:flex-start;font-size:11px;border-top:1px dashed var(--line);padding-top:2px;min-height:18px}.tses .p{color:var(--muted);width:10px}
.tchip{border-left:4px solid var(--ac,#999);background:var(--acb,#f3f3f3);border-radius:4px;padding:1px 4px;line-height:1.25}.tchip.tsac{border-left-color:#a32d2d;background:#fbe3e3;color:#7a1f1f}.tchip.tsp{border-left-color:#9aa3d9;background:#eef0fb;color:#2c3576}

.a1{--ac:#1f4fa0;--acb:#eef3fb}.a2{--ac:#b4532a;--acb:#fbefe9}.a3{--ac:#2b7a3d;--acb:#ecf6ee}.a4{--ac:#7a3fa0;--acb:#f4eefa}.a5{--ac:#1d7a86;--acb:#e9f5f6}.a6{--ac:#9a6b00;--acb:#fbf3e2}
.unitbar{font-size:19px;font-weight:700;margin:30px 0 2px}.unitbar span{font-weight:400;color:var(--muted);font-size:15px}
.secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;margin-top:8px}
.scard{background:#fff;border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:10px;padding:10px 12px}
.scard b.code{color:var(--ac)}.scard .ttl{font-weight:600;margin:2px 0 6px}
.rl{font-size:12.5px;color:var(--ink);margin:3px 0;display:grid;grid-template-columns:120px 1fr;gap:6px}.rl i{font-style:normal;color:var(--muted)}.rl span{display:block}
.rl.none{color:#a32d2d}.dl{display:inline-block;font-size:12px;color:#1d7266;text-decoration:none;border:1px solid #9fd3c9;border-radius:6px;padding:0 6px;margin:1px 3px 1px 0;font-weight:600;background:#fff}.dl:hover{background:#e6f5ee}.dl.off{color:#999;border-color:#ddd}
.path{font-size:11px;color:var(--muted);word-break:break-all;margin-top:6px}
.ystat{font-size:11px;padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:1px}.ystat.prog{background:#dff1e2;color:#1a6b2a}.ystat.no{background:#eee;color:#888}
.note{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;color:var(--ink)}
.tabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;background:#bbb;vertical-align:1px}.tabs button .dot.on{background:#2b9a4a}
a.ext{color:var(--accent)}
</style></head><body>
<div class="top"><header><h1>Physics Planner</h1><nav class="tabs" id="tabs"></nav></header>
<div class="subbar"><div class="toggle" id="views"></div><span class="sub" id="subinfo"></span><div class="ctl"><select id="aosFilter"></select><button id="fresh" title="Load the newest version from GitHub (skips the copy your browser saved)">↻ Get latest</button></div></div></div>
<main id="main"></main>
<script>
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let VIEW=store.get('ph:view','plan');const VIEWS=[['plan','Course plan'],['cambridge','Cambridge course'],['sd','Study design']];
let YEARS=[],DATA={},tab=store.get('ph:tab',11),open=new Set(store.get('ph:open',[])),filt='';
const V='?v='+Date.now();
async function load(){YEARS=(await (await fetch('data/years.json'+V)).json()).years;
 for(const y of YEARS) if(y.file) DATA[y.year]=await (await fetch(y.file+V)).json(); render()}
function tabs(){$('#tabs').innerHTML=YEARS.map(y=>`<button data-y="${y.year}" class="${tab==y.year?'on':''}">${esc(y.title)}<span class="dot ${y.file?'on':''}"></span></button>`).join('');
 $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=+b.dataset.y;store.set('ph:tab',tab);filt='';render()})}
const DR=id=>`https://drive.google.com/file/d/${id}/view`;
function chip(f,txt){return f.id?`<a class="dl" href="${DR(f.id)}" target="_blank" rel="noopener" title="${esc(f.name)}">${esc(txt)}</a>`:`<span class="dl off">${esc(txt)}</span>`}
function short(f){return f.name.replace(/^\d[A-Z] /,'').replace(/^(Check-in )?Set /,'Set ').replace(/^Check-in /,'').replace(/^Worksheet /,'').replace(/^Practical /,'').replace(/^PowerPoint /,'').replace(/ Answers$/,' answers')}
function row(lbl,fs,empty){return `<div class="rl ${fs.length?'':'none'}"><i>${lbl}</i><span>${fs.length?fs.map(f=>chip(f,short(f))).join(' '):(empty||'none')}</span></div>`}
function badge(t,on){return `<span class="${on?'y':''}">${esc(t)}</span>`}
function aosKey(u,a){return u*3+a-3}
function views(on){const v=$('#views');if(!on){v.innerHTML='';v.style.display='none';return}v.style.display='';
 v.innerHTML=VIEWS.map(([k,t])=>`<button data-v="${k}" class="${VIEW==k?'on':''}">${t}</button>`).join('');v.querySelectorAll('button').forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;store.set('ph:view',VIEW);render()})}
function frame(src){$('#aosFilter').style.display='none';$('#main').innerHTML=`<iframe id="fr" src="${src}" style="width:100%;border:0;min-height:80vh;display:block"></iframe>`;
 const fr=$('#fr');fr.onload=()=>{const fit=()=>{try{fr.style.height=fr.contentDocument.documentElement.scrollHeight+'px'}catch(e){}};fit();setTimeout(fit,600)}}
function render(){tabs();const y=YEARS.find(x=>x.year==tab)||YEARS[4];const d=DATA[y.year];
 $('#subinfo').textContent=`${y.title} · ${y.course}`;views(!!d);
 if(d&&VIEW=='cambridge')return frame('analysis.html'+V);
 if(d&&VIEW=='sd')return frame('studydesign.html'+V);
 const f=$('#aosFilter');
 if(!d){f.style.display='none';$('#main').innerHTML=`<div class="unit">${esc(y.title)} Physics</div><div class="placeholder"><b>${esc(y.course)}</b><p>Not planned yet.</p><ul><li>Source materials: to be decided</li><li>Course plan: to come</li><li>Lesson resources: to come</li></ul></div>`;return}
 f.style.display='';const opts=[];d.units.forEach(u=>u.aos.forEach(a=>opts.push([`${u.n}-${a.n}`,`Unit ${u.n} · AoS ${a.n}`])));
 f.innerHTML='<option value="">All areas of study</option>'+opts.map(([v,t])=>`<option value="${v}" ${filt==v?'selected':''}>${t}</option>`).join('');
 f.onchange=()=>{filt=f.value;render()};
 let h=`<div class="unit">Course plan</div><div class="legend">${d.units.map(u=>u.aos.map(a=>`<span class="a${aosKey(u.n,a.n)}"><i style="background:var(--ac)"></i>U${u.n} AoS ${a.n}</span>`).join('')).join('')}</div>
 <div class="note">Built on the <b>${esc(d.source)}</b> resources. Lessons are not planned yet: each chapter shows what Cambridge provides, section by section. See the <b>Cambridge course</b> and <b>Study design</b> tabs above.</div>
 <div class="ctl2"><button id="uall">Open all chapters</button><button id="unone">Close all chapters</button></div>`;
 for(const u of d.units){h+=`<div class="unitbar">Unit ${u.n} <span>${esc(u.title)}</span></div>`;
  for(const a of u.aos){if(filt&&filt!=`${u.n}-${a.n}`)continue;const k=aosKey(u.n,a.n),ud=`ud${u.n}-${a.n}`;
   const nsec=a.chapters.reduce((s,c)=>s+c.sections.length,0),npr=a.chapters.reduce((s,c)=>s+c.sections.reduce((t,x)=>t+x.pracs.length,0),0);
   h+=`<div class="trow"><div class="trh">Unit ${u.n} · AoS ${a.n}<span>${a.chapters.length?`${a.chapters.length} chapters · ${nsec} sections · ${npr} pracs`:''}</span></div><div class="vlist">
   <div class="udcard a${k} ${open.has(ud)?'open':''}" data-k="${ud}"><div class="uc1"><span>Unit ${u.n} · AoS ${a.n} · Unit details</span><span>${open.has(ud)?'▾':'▸'}</span></div><div class="uname">${esc(a.title)}</div><div class="umeta">${a.chapters.length?a.chapters.map(c=>'Ch '+c.n).join(', '):a.options?a.options.length+' Cambridge options':'No Cambridge materials on the drive'}</div></div>`;
   if(open.has(ud))h+=`<div class="uopen a${k}"><div class="aos"><b>Unit details</b><span>SACs and outcome: to be planned</span></div>${a.options?`<div class="colh" style="margin-top:8px">Options with Cambridge materials</div><div class="secgrid">${a.options.map(o=>`<div class="scard"><b class="code">Option ${esc(o.n)}</b><div class="ttl">${esc(o.title)}</div><div class="rl">Reading + answers (TEACHER ONLY)</div></div>`).join('')}</div>`:''}${!a.chapters.length&&!a.options?'<div class="note">The Cambridge folder for this AoS holds placeholder files only.</div>':''}${a.chapters.length?'<div class="note">Chapter tests and SACs will sit here once assessment is planned.</div>':''}</div>`;
   for(const c of a.chapters){const ck=`ch${c.n}`,isO=open.has(ck);
    const S=c.sections,ci=S.reduce((s,x)=>s+x.checkins,0),we=S.every(x=>x.workedExamples)?S.reduce((s,x)=>s+x.workedExamples.length,0):null,ws=S.reduce((s,x)=>s+x.worksheets,0),pr=S.reduce((s,x)=>s+x.pracs.length,0);
    h+=`<div class="ucard a${k} ${isO?'open':''}" data-k="${ck}"><div class="uc1"><span>Ch ${c.n} · Unit ${u.n} AoS ${a.n}</span><span>${isO?'▾':'▸'}</span></div><div class="uname">${esc(c.title)}</div><div class="umeta">${S.length} sections · ${S.map(x=>x.code).join(', ')} · lessons not planned yet</div>
    <div class="ubad">${badge('Sections '+S.length,1)}${badge('Check-ins '+ci,ci)}${we===null?badge('Worked examples ?',0):badge('Worked examples '+we,we)}${badge('Worksheets '+ws,ws)}${badge('Pracs '+pr,pr)}${badge(c.testMarks?'Chapter test /'+c.testMarks:'Chapter test',c.chapter.test)}${badge('Review',c.chapter.review)}${badge('Slides 0',0)}${badge('Guided sheets 0',0)}</div></div>`;
    if(isO){h+=`<div class="uopen a${k}"><div class="aos"><b>Chapter ${c.n} · ${esc(c.title)}</b><span>${S.length} Cambridge sections</span></div><div class="secgrid">`;
     const book=(c.files||[]).find(f=>f.kind=='book');
     for(const s of S){const K=k=>(s.files||[]).filter(f=>f.kind==k);h+=`<div class="scard"><b class="code">${esc(s.code)}</b><div class="ttl">${esc(s.title)}</div>
      ${row('Check-ins',K('checkin'))}${row('Section questions',K('sq'))}${row('Worksheet',K('ws'))}${row('PowerPoint figures',K('ppt'))}${row('Practicals',K('prac'))}
      <div class="rl ${s.workedExamples&&!s.workedExamples.length?'none':''}"><i>Worked examples</i><span>${s.workedExamples?(s.workedExamples.length?s.workedExamples.map(esc).join('<br>')+(book?'<br>'+chip(book,'Textbook chapter'):''):'none'):'not indexed yet'}</span></div><div class="path">${esc(s.folder)}</div></div>`}
     const CF=k=>(c.files||[]).filter(f=>f.kind==k);
     h+=`</div><div class="colh" style="margin-top:12px">Chapter resources</div><div class="secgrid"><div class="scard">${row('Textbook',CF('book'))}${row('Review questions',CF('review'))}${row('Checklist',CF('checklist'))}${row('Model summary',CF('summary'))}${row('Internet resources',CF('links'))}</div><div class="scard"><div class="colh" style="margin-bottom:4px">Teacher only</div>${row('Chapter test',CF('test'))}${row('Suggested responses',CF('resp'))}${row('Worksheet answers',CF('wsans'))}</div></div><div class="path">${esc(c.folder)}</div></div>`}
   }
   h+='</div></div>'}}
 $('#main').innerHTML=h;
 document.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{const k=el.dataset.k;open.has(k)?open.delete(k):open.add(k);store.set('ph:open',[...open]);render()});
 $('#uall').onclick=()=>{d.units.forEach(u=>u.aos.forEach(a=>a.chapters.forEach(c=>open.add('ch'+c.n))));store.set('ph:open',[...open]);render()};
 $('#unone').onclick=()=>{[...open].filter(k=>k.startsWith('ch')).forEach(k=>open.delete(k));store.set('ph:open',[...open]);render()};
}
$('#fresh').onclick=()=>location.reload();
load();
</script></body></html>
